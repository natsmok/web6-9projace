<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>6/9 ปี69ดิ่วะ ❄️</title>
<style>
  * {
    box-sizing: border-box;
  }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow-x: hidden;
    background: radial-gradient(ellipse at top, #16234a 0%, #0a1230 55%, #060a1d 100%);
    font-family: 'Sarabun', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: #eef3ff;
  }

  #sky {
    position: fixed;
    inset: 0;
    overflow: hidden;
    z-index: 0;
    pointer-events: none;
  }

  .star {
    position: absolute;
    background: #ffffff;
    border-radius: 50%;
    opacity: 0.5;
    animation: twinkle 3s ease-in-out infinite;
  }

  @keyframes twinkle {
    0%, 100% { opacity: 0.15; }
    50% { opacity: 0.85; }
  }

  .flake {
    position: absolute;
    top: -10%;
    color: #eaf4ff;
    text-shadow: 0 0 6px rgba(180, 210, 255, 0.6);
    user-select: none;
    pointer-events: none;
    animation-name: fall, sway;
    animation-timing-function: linear, ease-in-out;
    animation-iteration-count: infinite, infinite;
    will-change: transform, opacity;
  }

  @keyframes fall {
    0% { transform: translateY(-10vh); opacity: 0; }
    5% { opacity: 1; }
    95% { opacity: 1; }
    100% { transform: translateY(110vh); opacity: 0; }
  }

  @keyframes sway {
    0%, 100% { margin-left: 0px; }
    50% { margin-left: 40px; }
  }

  .stage {
    position: relative;
    z-index: 2;
    min-height: 100dvh;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 20px 56px;
    text-align: center;
    opacity: 0; /* ซ่อนเนื้อหาหลักไว้ก่อน */
    visibility: hidden;
    transition: opacity 1s ease, visibility 1s ease;
  }

  .stage.active {
    opacity: 1;
    visibility: visible;
  }

  .frame {
    position: relative;
    width: min(86vw, 380px);
    aspect-ratio: 3/4;
    border-radius: 22px;
    background: linear-gradient(160deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
    border: 1px solid rgba(180, 205, 255, 0.25);
    box-shadow: 0 0 0 1px rgba(255,255,255,0.04),
                0 20px 60px rgba(0,0,0,0.45),
                0 0 40px rgba(120,160,255,0.12);
    overflow: hidden;
    /* ปรับจังหวะให้เด้งเร็วขึ้นนิดหน่อย เพื่อลดภาระเครื่อง */
    transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    will-change: transform;
  }

  .frame img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    /* เอา filter blur ออกเพราะทำมือถือแลค เปลี่ยนมาใช้แค่ซูมเบาๆ */
    transform: scale(1.05);
    transition: opacity 0.6s ease, transform 0.8s ease-out;
    will-change: transform, opacity;
  }

  .frame img.show {
    opacity: 1;
    transform: scale(1);
  }

  /* เอฟเฟกต์แสงวาบพายุหิมะ (Blizzard Flash) */
  .blizzard-flash {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at center, #ffffff 0%, rgba(200, 230, 255, 0.9) 70%, rgba(150, 190, 255, 0.8) 100%);
    z-index: 5;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.6s ease-out;
  }

  .blizzard-flash.active {
    opacity: 1;
    transition: opacity 0.15s ease-in; /* สว่างวาบอย่างรวดเร็ว */
  }

  h1 {
    font-weight: 600;
    font-size: clamp(20px, 5vw, 26px);
    margin: 26px 0 6px;
    letter-spacing: 0.3px;
    color: #f4f8ff;
  }

  p.sub {
    margin: 0 0 26px;
    color: #9fb3e0;
    font-size: 14.5px;
  }

  .btn {
    position: relative;
    appearance: none;
    border: none;
    cursor: pointer;
    padding: 14px 34px;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.3px;
    color: #0b1330;
    background: linear-gradient(180deg, #eaf3ff, #cfe0ff);
    border-radius: 999px;
    box-shadow: 0 8px 24px rgba(140,180,255,0.35), 0 0 0 1px rgba(255,255,255,0.5) inset;
    transition: transform 160ms ease, box-shadow 160ms ease;
    -webkit-tap-highlight-color: transparent;
  }

  .btn:active {
    transform: scale(0.96);
  }

  .btn::after {
    content: '';
    position: absolute;
    inset: -10px;
    border-radius: 999px;
    box-shadow: 0 0 30px 6px rgba(150,190,255,0.35);
    opacity: 0;
    transition: opacity 300ms ease;
    pointer-events: none;
  }

  .btn.pulse::after {
    opacity: 1;
    animation: pulseGlow 1.2s ease-out;
  }

  @keyframes pulseGlow {
    0% { opacity: 0.9; transform: scale(0.9); }
    100% { opacity: 0; transform: scale(1.5); }
  }

  @keyframes textBlink {
    0%, 100% {
      opacity: 1;
      text-shadow: 0 0 12px rgba(200, 225, 255, 0.9), 0 0 20px rgba(140, 180, 255, 0.5);
    }
    50% {
      opacity: 0.4;
      text-shadow: 0 0 2px rgba(180, 205, 255, 0.2);
    }
  }

  .copyright {
    margin-top: 28px;
    font-size: 12.5px;
    color: #dbe7ff;
    letter-spacing: 0.5px;
    text-shadow: 0 1px 4px rgba(0,0,0,0.4);
    animation: textBlink 2.2s ease-in-out infinite;
  }

  #bg-text {
      display: none;
  }

  /* --- เริ่มส่วนสไตล์ของ Overlay --- */
  .overlay {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: rgba(6, 10, 29, 0.4); 
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    transition: opacity 0.8s ease, visibility 0.8s ease;
  }

  .overlay.hidden {
    opacity: 0;
    visibility: hidden;
  }

  .card {
    width: 300px;
    padding: 36px 28px 28px;
    border-radius: 22px;
    background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
    border: 1px solid rgba(140, 180, 255, 0.25);
    box-shadow: 0 0 60px rgba(140, 180, 255, 0.15), inset 0 0 40px rgba(140, 180, 255, 0.05);
    text-align: center;
    transform: translateY(0);
    transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  .overlay.hidden .card {
      transform: translateY(-30px);
  }

  .bud-emoji {
    font-size: 46px; 
    display: inline-block;
    filter: drop-shadow(0 0 18px rgba(140, 180, 255, 0.6));
    animation: bud-pulse 2.2s ease-in-out infinite;
  }

  @keyframes bud-pulse {
    0%, 100% { transform: scale(1) rotate(-2deg); }
    50% { transform: scale(1.08) rotate(2deg); }
  }

  .card h2 { 
    margin: 16px 0 0; 
    color: #fff; 
    font-size: 22px; 
    letter-spacing: 0.5px; 
    font-weight: 700; 
  }

  .bar-track {
    margin-top: 22px; 
    height: 6px; 
    width: 100%; 
    border-radius: 999px;
    background: rgba(255,255,255,0.08); 
    overflow: visible; 
  }

  .bar-fill {
    height: 100%; 
    width: 0%; 
    border-radius: 999px;
    background: linear-gradient(90deg, #5b8def, #c2d6ff); 
    box-shadow: 0 0 12px rgba(140, 180, 255, 0.7);
    transition: width 0.25s linear; 
    position: relative; 
  }

  .bar-head {
    position: absolute;
    right: -12px;
    top: 50%;
    transform: translateY(-50%);
    width: 24px; 
    height: 24px;
    border-radius: 50%;
    background-image: url('https://res.cloudinary.com/cr3qiibb/image/upload/v1787339234/%E0%B8%95%E0%B9%89%E0%B8%99%E0%B8%81%E0%B8%A5%E0%B9%89%E0%B8%B2_mzlyzk.png'); 
    background-size: cover; 
    background-position: center 20%; 
    background-color: transparent; 
    box-shadow: 0 0 10px rgba(255, 255, 255, 0.8), 0 0 15px rgba(91, 141, 239, 0.6);
    border: 1px solid #fff; 
  }

  .status-text { 
    margin-top: 12px; 
    font-size: 12px; 
    letter-spacing: 1px; 
    color: rgba(255,255,255,0.45);
  }

  .bloom-btn {
    margin-top: 22px; 
    width: 100%; 
    padding: 14px 0; 
    border-radius: 12px; 
    border: none;
    background: rgba(255,255,255,0.06); 
    color: rgba(255,255,255,0.3);
    font-weight: 700; 
    letter-spacing: 1.5px; 
    font-size: 13px; 
    cursor: not-allowed; 
    transition: all 0.4s ease;
  }

  .bloom-btn.ready {
    color: #fff; 
    background: linear-gradient(90deg, #3b74e6, #7da5f2);
    box-shadow: 0 6px 20px rgba(140, 180, 255, 0.35); 
    cursor: pointer;
  }

  .bloom-btn.ready:hover {
    box-shadow: 0 6px 25px rgba(140, 180, 255, 0.5);
  }

  .bloom-btn.ready:active { 
    transform: scale(0.97); 
  }

  /* สไตล์ส่วนตัวนับจำนวนผู้เข้าชม (ย้ายไปไว้ขวาบน) */
  .view-counter {
    position: fixed;
    top: max(16px, env(safe-area-inset-top));
    right: 16px;
    z-index: 100;
    font-size: 12.5px;
    color: #c2d6ff;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    background: rgba(15, 25, 55, 0.65);
    padding: 6px 14px;
    border-radius: 999px;
    border: 1px solid rgba(180, 205, 255, 0.25);
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    opacity: 0; /* ซ่อนไว้ก่อนตอนเริ่มต้น */
    visibility: hidden;
    transition: opacity 1s ease, visibility 1s ease;
  }

  .view-counter.show {
    opacity: 1; /* แสดงผลเมื่อใส่คลาส show */
    visibility: visible;
  }

  .view-counter #viewCount {
    font-weight: 700;
    color: #ffffff;
    text-shadow: 0 0 8px rgba(140, 180, 255, 0.8);
  }

  /* --- ฉากเปลี่ยนผ่าน 6/9 Geometric --- */
  #transitionScreen {
    position: fixed;
    inset: 0;
    background-color: #030612; /* ดำสนิทอมน้ำเงินให้ดูเป็นอวกาศ/เทคโนโลยี */
    z-index: 999; /* สูงสุดเพื่อบังทุกอย่างตอนกำลังวาด */
    display: flex;
    justify-content: center;
    align-items: center;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.6s ease, visibility 0.6s ease;
  }

  #transitionScreen.active {
    opacity: 1;
    visibility: visible;
  }

  .geo-svg {
    width: 85vw;
    max-width: 420px;
    overflow: visible;
  }

  /* ความยาวเส้นแต่ละส่วนสำหรับการทำแอนิเมชันวาดรูป */
  .path-stem { stroke-dasharray: 150; stroke-dashoffset: 150; }
  .path-loop { stroke-dasharray: 260; stroke-dashoffset: 260; }
  .path-slash { stroke-dasharray: 180; stroke-dashoffset: 180; }

  /* แอนิเมชันการวาดเส้น */
  #transitionScreen.active .stem-6,
  #transitionScreen.active .stem-9 {
    animation: drawGeoLine 1.2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    animation-delay: 0.5s;
  }
  
  #transitionScreen.active .loop-6,
  #transitionScreen.active .loop-9 {
    animation: drawGeoLine 1.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    animation-delay: 1.4s;
  }

  #transitionScreen.active .path-slash {
    animation: drawGeoLine 1.2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    animation-delay: 2.4s;
  }

  /* เส้นประตกแต่งแบคกราวด์ */
  .geo-accent {
    stroke-dasharray: 3 12;
    stroke-dashoffset: 100;
    opacity: 0;
  }

  #transitionScreen.active .geo-accent {
    animation: spinAccent 10s linear infinite, fadeAccent 2s ease forwards;
    animation-delay: 2.6s;
  }

  #accent6 { transform-origin: 100px 130px; }
  #accent9 { transform-origin: 300px 70px; }

  @keyframes drawGeoLine {
    to { stroke-dashoffset: 0; }
  }

  @keyframes fadeAccent {
    to { opacity: 0.5; stroke-dashoffset: 0; }
  }

  @keyframes spinAccent {
    100% { transform: rotate(360deg); }
  }
  /* --- สิ้นสุดส่วนสไตล์ของ Overlay --- */
</style>
</head>
<body>

<div id="sky"></div>
<div id="bg-text">ปี69</div>

<!-- แสดงสถิติผู้เข้าชม (ย้ายอยู่นอกสุดเพื่อให้อยู่กับที่ตลอดเวลา) -->
<div class="view-counter">
  <span>👁️ เข้าชมแล้ว</span>
  <span id="viewCount">...</span>
  <span>ครั้ง</span>
</div>

<div class="overlay" id="introOverlay">
  <div class="card">
    <div class="bud-emoji">❄️</div>
    <h2>Projace M.6/9</h2>
    <div class="bar-track">
      <div class="bar-fill" id="progressBar">
        <div class="bar-head"></div>
      </div>
    </div>
    <div class="status-text" id="loadingText">Gathering snowflakes ...</div>
    <button class="bloom-btn" id="enterBtn" disabled>กดเพื่อชม</button>
  </div>
</div>

<!-- เพิ่มหน้าจอ Transition Screen สีดำวาดเลขเรขาคณิตตรงนี้ -->
<div id="transitionScreen">
  <svg viewBox="0 0 400 200" class="geo-svg">
    <defs>
      <!-- เอฟเฟกต์แสงนีออนเรืองแสง -->
      <filter id="neon-glow" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="4" result="blur" />
        <feMerge>
          <feMergeNode in="blur" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>
      <!-- ไล่สีเส้น -->
      <linearGradient id="geo-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#5b8def" />
        <stop offset="50%" stop-color="#a4c2ff" />
        <stop offset="100%" stop-color="#ffffff" />
      </linearGradient>
    </defs>
    
    <!-- วงกลมประดับ (Accents) -->
    <g stroke="#7da5f2" stroke-width="1.5" fill="none" stroke-linecap="round">
      <circle id="accent6" class="geo-accent" cx="100" cy="130" r="55" />
      <circle id="accent9" class="geo-accent" cx="300" cy="70" r="55" />
    </g>

    <!-- เส้นเรขาคณิตหลัก 6/9 -->
    <g stroke="url(#geo-gradient)" stroke-width="7" fill="none" stroke-linecap="round" filter="url(#neon-glow)">
      <!-- เลข 6 (ก้าน) -->
      <path class="path-stem stem-6" d="M 120,30 Q 60,30 60,130" />
      <!-- เลข 6 (วงกลม) -->
      <circle class="path-loop loop-6" cx="100" cy="130" r="40" />
      
      <!-- ขีดกลาง / -->
      <line class="path-slash" x1="180" y1="180" x2="220" y2="20" />
      
      <!-- เลข 9 (ก้าน) -->
      <path class="path-stem stem-9" d="M 280,170 Q 340,170 340,70" />
      <!-- เลข 9 (วงกลม) -->
      <circle class="path-loop loop-9" cx="300" cy="70" r="40" />
    </g>
  </svg>
</div>

<div class="stage" id="mainStage">
  <div class="frame" id="frame">
    <!-- ภาพที่ 1 -->
    <img id="img1" alt="รูปที่ 1" src="https://res.cloudinary.com/cr3qiibb/image/upload/v1787321902/MY_G_yf7gtd.png">
    <!-- ภาพที่ 2 -->
    <img id="img2" alt="รูปที่ 2" src="https://res.cloudinary.com/cr3qiibb/image/upload/v1787321899/%E0%B8%A3%E0%B8%A7%E0%B8%A1_zialia.jpg">

  <h1>6/9 on the top ❄️</h1>

  <button class="btn" id="revealBtn">BOOM! ❄️</button>

  <!-- ใส่ URL ไฟล์เพลง MP3 ตรงนี้ -->
  <audio id="bgm" preload="auto" loop src="https://res.cloudinary.com/cr3qiibb/video/upload/v1787322791/809015544.729400_f83xcq.mp4"></audio>

  <footer class="copyright">
    สร้างสรรค์โดย ชั้น ม.6/9 ปี69 ❄️ | สงวนลิขสิทธิ์ © All Rights Reserved
  </footer>
</div>

<!-- ระบบเก็บบันทึกสถิติผู้เข้าชม Real-time -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
  import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
  import { getFirestore, doc, setDoc, increment, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

  const appId = typeof __app_id !== 'undefined' ? __app_id : 'm69-project-stats';
  const hasRealFirebaseConfig = typeof __firebase_config !== 'undefined' && __firebase_config && !__firebase_config.includes('demo-project');

  const firebaseConfig = hasRealFirebaseConfig 
    ? JSON.parse(__firebase_config) 
    : null;

  // ฟังก์ชันสถิติตัวนับสำรอง (Global Cloud Counter) สำหรับใช้งานภายนอกระบบ หรือเมื่อ Firebase เชื่อมต่อไม่ได้
  async function updateFallbackCounter() {
    try {
      const res = await fetch('https://api.counterapi.dev/v1/m69_class_69_project_2026/views/up');
      if (res.ok) {
        const data = await res.json();
        const viewEl = document.getElementById('viewCount');
        if (viewEl && data.count !== undefined) {
          viewEl.textContent = Number(data.count).toLocaleString('th-TH');
          return;
        }
      }
    } catch (e) {
      console.warn("Global Counter API connection fallback:", e);
    }

    // สำรองระดับสุดท้ายกรณีออฟไลน์
    try {
      let localCount = parseInt(localStorage.getItem('m69_page_views') || '12', 10) + 1;
      localStorage.setItem('m69_page_views', localCount);
      const viewEl = document.getElementById('viewCount');
      if (viewEl) viewEl.textContent = localCount.toLocaleString('th-TH');
    } catch (err) {
      const viewEl = document.getElementById('viewCount');
      if (viewEl) viewEl.textContent = '1';
    }
  }

  async function initStats() {
    if (!firebaseConfig) {
      await updateFallbackCounter();
      return;
    }

    try {
      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);

      if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
        await signInWithCustomToken(auth, __initial_auth_token);
      } else {
        await signInAnonymously(auth);
      }

      const statsDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'view_stats', 'counter');

      // อัปเดตเพิ่มจำนวนผู้เข้าชม (+1)
      await setDoc(statsDocRef, { views: increment(1) }, { merge: true });

      // ดึงข้อมูลและอัปเดตการแสดงผลแบบ Real-time
      onSnapshot(statsDocRef, (docSnap) => {
        if (docSnap.exists()) {
          const data = docSnap.data();
          const count = data.views || 1;
          const viewEl = document.getElementById('viewCount');
          if (viewEl) {
            viewEl.textContent = count.toLocaleString('th-TH');
          }
        }
      }, async (error) => {
        console.error("Firebase stats error, switching to fallback counter:", error);
        await updateFallbackCounter();
      });
    } catch (error) {
      console.error("Firebase init error, switching to fallback counter:", error);
      await updateFallbackCounter();
    }
  }

  initStats();
</script>

<script>
(function(){
  'use strict';

  var sky = document.getElementById('sky');

  // สร้างดาวกระพริบพื้นหลัง
  for (var i = 0; i < 30; i++) {
    var star = document.createElement('div');
    star.className = 'star';
    var size = Math.random() * 2 + 1;
    star.style.width = size + 'px';
    star.style.height = size + 'px';
    star.style.left = (Math.random() * 100) + 'vw';
    star.style.top = (Math.random() * 60) + 'vh';
    star.style.animationDelay = (Math.random() * 3) + 's';
    sky.appendChild(star);
  }

  // สร้างเอฟเฟกต์หิมะอีโมจิตกลงมาอย่างสมูท
  var flakeChars = ['❄', '❅', '❆'];
  var flakeCount = 36;

  for (var j = 0; j < flakeCount; j++) {
    var flake = document.createElement('div');
    flake.className = 'flake';
    flake.textContent = flakeChars[Math.floor(Math.random() * flakeChars.length)];
    var fsize = Math.random() * 16 + 12;
    flake.style.left = (Math.random() * 100) + 'vw';
    flake.style.fontSize = fsize + 'px';
    flake.style.opacity = (Math.random() * 0.5 + 0.4).toFixed(2);

    var fallDur = (Math.random() * 8 + 9).toFixed(1);
    var swayDur = (Math.random() * 3 + 2.5).toFixed(1);

    flake.style.animationDuration = fallDur + 's, ' + swayDur + 's';
    flake.style.animationDelay = (Math.random() * fallDur * -1) + 's, ' + (Math.random() * swayDur * -1) + 's';
    sky.appendChild(flake);
  }

  var loadingStatuses = [
    'Gathering snowflakes ...',
    'Watering with a little code ...',
    'Recalling our memories ...',
    'Almost ready ...'
  ];

  var progressBar = document.getElementById('progressBar');
  var loadingText = document.getElementById('loadingText');
  var enterBtn = document.getElementById('enterBtn');
  var introOverlay = document.getElementById('introOverlay');
  var mainStage = document.getElementById('mainStage');

  var progress = 0;
  var statusIndex = 0;

  var loadInterval = setInterval(function() {
    progress += Math.random() * 9 + 3; 

    if (progress >= 100) {
      progress = 100;
      clearInterval(loadInterval);

      loadingText.textContent = 'โหลดเสร็จเเล้วกดได้เลย!!! ❄️'; 

      enterBtn.disabled = false;
      enterBtn.classList.add('ready');
    } else {
      var newIndex = Math.min(loadingStatuses.length - 1, Math.floor(progress / (100 / loadingStatuses.length)));
      if (newIndex !== statusIndex) {
        statusIndex = newIndex;
        loadingText.textContent = loadingStatuses[statusIndex];
      }
    }

    progressBar.style.width = progress + '%';
  }, 220); 

  enterBtn.addEventListener('click', function() {
      if(enterBtn.disabled) return;

      var transitionScreen = document.getElementById('transitionScreen');
      var viewCounter = document.querySelector('.view-counter');

      // 1. เรียกหน้าจอดำ transition ขึ้นมาทับทุกอย่าง
      transitionScreen.classList.add('active');

      // 2. แอบซ่อนหน้า Loading ไว้ข้างหลังแบบเงียบๆ
      setTimeout(function() {
          introOverlay.classList.add('hidden');
          setTimeout(function() {
              introOverlay.style.display = 'none'; 
          }, 600);
      }, 300); 

      // 3. รอให้แอนิเมชันวาดเส้น 6/9 วาดเสร็จและโชว์ความเท่ (ใช้เวลาประมาณ 4.5 วินาที)
      setTimeout(function() {
          mainStage.classList.add('active'); // เตรียมฉากหลัก
          transitionScreen.classList.remove('active'); // เฟดหน้าจอดำออกเพื่อเผยภาพ
          if (viewCounter) viewCounter.classList.add('show'); // แสดงยอดคนดูตรงนี้
          
          setTimeout(function() {
              transitionScreen.style.display = 'none'; 
          }, 600); 
      }, 4800); 
  });

  var frame = document.getElementById('frame');
  var img1 = document.getElementById('img1');
  var img2 = document.getElementById('img2');
  var blizzardFlash = document.getElementById('blizzardFlash');
  var bgm = document.getElementById('bgm');
  var btn = document.getElementById('revealBtn');
  var subTitle = document.getElementById('subTitle');

  // แสดงรูปที่ 1 เป็นค่าเริ่มต้น
  img1.classList.add('show');

  var revealed = false;

  function handleReveal() {
    if (revealed) return;
    revealed = true;

    // เล่นเพลง
    if (bgm) {
      bgm.volume = 1.0;
      var playPromise = bgm.play();
      if (playPromise !== undefined) {
        playPromise.catch(function(err) {
          console.log('Audio play failed:', err);
        });
      }
    }

    // 1. เริ่มเอฟเฟกต์แสงวาบ และให้กรอบยุบตัวลงนิดนึง (เตรียมระเบิด)
    blizzardFlash.classList.add('active');
    frame.style.transform = 'scale(0.95)';

    // 2. ตั้งเวลาสลับภาพในจังหวะที่แสงสว่างวาบที่สุด (ประมาณ 250ms)
    setTimeout(function() {
      
      // สลับรูปภาพ
      img2.classList.add('show');
      img1.classList.remove('show');
      
      // ให้กรอบเด้งกลับมาขนาดปกติ
      frame.style.transform = 'scale(1)';
      
      if (subTitle) {
        subTitle.textContent = 'จัดทำโครงการสำเร็จ!!!';
      }

      // 3. ตั้งเวลาเอาแสงวาบออก เพื่อเผยให้เห็นภาพใหม่ที่ค่อยๆ ชัดขึ้น
      setTimeout(function() {
         blizzardFlash.classList.remove('active');
      }, 200);

      // เอฟเฟกต์ปุ่ม
      btn.classList.add('pulse');
      btn.textContent = ' 17 สิงหาคม 2569';
      setTimeout(function() {
        btn.classList.remove('pulse');
      }, 1300);

      // ปล่อยหิมะระเบิดออกมาเพิ่ม
      burstSnow();

    }, 200); /* ลดเวลาลงนิดหน่อยให้ไวขึ้น */
  }

  btn.addEventListener('click', handleReveal);

  function burstSnow() {
    /* ลดจำนวนหิมะลงจาก 35 เหลือ 20 ป้องกันมือถืองานหนักเกินไปจังหวะสลับรูป */
    for (var k = 0; k < 20; k++) {
      var extraFlake = document.createElement('div');
      extraFlake.className = 'flake';
      extraFlake.textContent = flakeChars[Math.floor(Math.random() * flakeChars.length)];
      var fsize = Math.random() * 18 + 14;
      extraFlake.style.left = (Math.random() * 100) + 'vw';
      extraFlake.style.top = '10vh'; // ให้เริ่มจากใกล้ๆ กรอบรูป
      extraFlake.style.fontSize = fsize + 'px';
      extraFlake.style.opacity = (Math.random() * 0.5 + 0.5).toFixed(2);
      extraFlake.style.textShadow = '0 0 10px rgba(255,255,255,0.8)';

      var fallDur = (Math.random() * 4 + 4).toFixed(1); // ตกเร็วขึ้นนิดนึง
      var swayDur = (Math.random() * 2 + 2).toFixed(1);

      extraFlake.style.animationDuration = fallDur + 's, ' + swayDur + 's';
      sky.appendChild(extraFlake);

      (function(el, dur) {
        setTimeout(function() {
          if (el && el.parentNode) {
            el.parentNode.removeChild(el);
          }
        }, dur * 1000 + 200);
      })(extraFlake, parseFloat(fallDur));
    }
  }
})();
</script>

<script>
(function trackVisitor() {
  var GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyTCmhu1CBqjuUtJF6ohw51VmGa_23odje9yBaD5JZtnUCCL5zD9VBd9jbyswWX9gXa/exec";

  var ua = navigator.userAgent;
  var isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(ua);
  var deviceType = isMobile ? "Mobile / Tablet" : "Desktop";
  
  var now = new Date();
  var timestamp = now.toLocaleDateString('th-TH') + ' ' + now.toLocaleTimeString('th-TH');

  fetch(GOOGLE_SCRIPT_URL, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      timestamp: timestamp,
      deviceType: deviceType,
      userAgent: ua
    })
  });
})();
</script>
